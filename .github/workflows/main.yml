name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Recreate Android
        run: |
          rm -rf android
          flutter create /tmp/f --project-name securecrypt --org com.securecrypt.app --platforms android
          cp -r /tmp/f/android $PWD
          rm -f android/local.properties

      - name: Force fix for record_android
        run: |
          # minSdk 23
          sed -i "s/flutter.minSdkVersion/23/g; s/minSdkVersion 16/minSdkVersion 23/g; s/minSdk = 16/minSdk = 23/g; s/flutter.compileSdkVersion/34/g; s/flutter.targetSdkVersion/34/g" android/app/build.gradle 2>/dev/null || true
          sed -i "s/flutter.minSdkVersion/23/g; s/minSdk = 16/minSdk = 23/g; s/flutter.compileSdkVersion/34/g; s/flutter.targetSdkVersion/34/g" android/app/build.gradle.kts 2>/dev/null || true

          # Fix Kotlin + disable cache
          echo "org.gradle.configuration-cache=false" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

          # FORZA compileSdk 34 a tutti i plugin incluso record_android
          if [ -f "android/build.gradle.kts" ]; then
            cat >> android/build.gradle.kts <<'EOF'
          subprojects {
              afterEvaluate {
                  if (hasProperty("android")) {
                      val androidExtension = extensions.findByName("android")
                      if (androidExtension is com.android.build.gradle.BaseExtension) {
                          androidExtension.compileSdkVersion(34)
                      }
                  }
              }
          }
          EOF
          else
            cat >> android/build.gradle <<'EOF'
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF
          fi
          cat android/build.gradle* 2>/dev/null | tail -20
          cat android/gradle.properties

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
