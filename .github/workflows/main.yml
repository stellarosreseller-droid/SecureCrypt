name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Setup Android + Icon + Name
        run: |
          rm -rf android
          flutter create /tmp/fresh --project-name securecrypt --org com.securecrypt.app --platforms android
          mv /tmp/fresh/android $PWD
          sed -i 's/android:label="securecrypt"/android:label="SecureCrypt.com"/' android/app/src/main/AndroidManifest.xml
          if [ -f icon.png ]; then
            cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi
      - name: Inject App with Voice Changer
        run: |
          cat > pubspec.yaml << 'YAML'
          name: securecrypt
          description: SecureCrypt.com Voice Changer Vault
          publish_to: 'none'
          version: 1.0.0+2
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            record: ^5.0.4
            just_audio: ^0.9.36
            path_provider: ^2.1.1
            permission_handler: ^11.3.1
            file_picker: ^8.0.5
            share_plus: ^8.0
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:record/record.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:share_plus/share_plus.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, theme: ThemeData.dark().copyWith(scaffoldBackgroundColor: const Color(0xFF0F0F0F)), home: const PinScreen());
            }
          }

          class PinScreen extends StatefulWidget { const PinScreen({super.key}); @override State<PinScreen> createState() => _PinScreenState(); }
          class _PinScreenState extends State<PinScreen> {
            final ctrl = TextEditingController();
            String msg = 'PIN: 123456 reale / 000000 fake';
            void check() {
              final p = ctrl.text.trim();
              if (p == '123456') Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const VaultScreen(fake: false)));
              else if (p == '000000') Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const VaultScreen(fake: true)));
              else { setState(() => msg = 'PIN errato'); ctrl.clear(); }
            }
            @override Widget build(BuildContext context) {
              return Scaffold(body: Center(child: Padding(padding: const EdgeInsets.all(32), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                const Icon(Icons.lock_outline, size: 80, color: Color(0xFF00FF88)),
                const SizedBox(height: 20),
                const Text('SecureCrypt.com', style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),
                const SizedBox(height: 40),
                TextField(controller: ctrl, obscureText: true, keyboardType: TextInputType.number, textAlign: TextAlign.center, style: const TextStyle(fontSize: 24, letterSpacing: 8), decoration: InputDecoration(hintText: '------', border: OutlineInputBorder(borderRadius: BorderRadius.circular(12))), onSubmitted: (_) => check()),
                const SizedBox(height: 12), Text(msg, style: const TextStyle(color: Colors.grey, fontSize: 11)),
                const SizedBox(height: 20),
                SizedBox(width: double.infinity, child: ElevatedButton(onPressed: check, style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF00FF88), foregroundColor: Colors.black, padding: const EdgeInsets.symmetric(vertical: 16)), child: const Text('SBLOCCA'))),
              ]))));
            }
          }

          class VaultScreen extends StatefulWidget { final bool fake; const VaultScreen({super.key, required this.fake}); @override State<VaultScreen> createState() => _VaultScreenState(); }

          class _VaultScreenState extends State<VaultScreen> with SingleTickerProviderStateMixin {
            late TabController tab; final rec = AudioRecorder(); final player = AudioPlayer();
            bool isRec = false; List<FileSystemEntity> files = []; String vaultPath = '';
            double pitch = 1.0; String voiceName = 'Normale';
            File? lastRecord;

            @override void initState() { super.initState(); tab = TabController(length: 3, vsync: this); initVault(); }
            Future<void> initVault() async {
              await Permission.microphone.request(); await Permission.storage.request();
              final d = await getApplicationDocumentsDirectory();
              final vd = Directory('${d.path}/vault');
              if (!await vd.exists()) await vd.create(recursive: true);
              setState(() => vaultPath = vd.path); refresh();
            }
            void refresh() { if (vaultPath.isEmpty) return; setState(() => files = Directory(vaultPath).listSync().where((f) => f is File).toList()..sort((a,b)=> b.statSync().modified.compareTo(a.statSync().modified))); }

            Future<void> toggleRec() async {
              if (isRec) {
                final path = await rec.stopRecorder();
                setState(() => isRec = false);
                if (path!= null) lastRecord = File(path);
                refresh();
              } else {
                if (await rec.hasPermission()) {
                  final dir = await getApplicationDocumentsDirectory();
                  await rec.start(const RecordConfig(), path: '${dir.path}/vault/voice_${DateTime.now().millisecondsSinceEpoch}.m4a');
                  setState(() => isRec = true);
                }
              }
            }

            Future<void> playWithVoice(File f) async {
              await player.stop();
              await player.setFilePath(f.path);
              await player.setSpeed(pitch);
              await player.setPitch(pitch);
              await player.play();
            }

            void setVoice(double p, String name) {
              setState(() { pitch = p; voiceName = name; });
              if (player.playing) { player.setSpeed(p); player.setPitch(p); }
            }

            Future<void> shareVoice(File f) async { await Share.shareXFiles([XFile(f.path)], text: 'SecureCrypt.com voice $voiceName'); }

            @override Widget build(BuildContext context) {
              if (widget.fake) return Scaffold(appBar: AppBar(title: const Text('Calculator')), body: const Center(child: Text('Nessun file', style: TextStyle(color: Colors.grey))));
              return Scaffold(
                appBar: AppBar(
                  title: const Text('SecureCrypt.com'),
                  bottom: TabBar(controller: tab, tabs: const [Tab(icon: Icon(Icons.mic), text: 'Ghost'), Tab(icon: Icon(Icons.graphic_eq), text: 'Cambia Voce'), Tab(icon: Icon(Icons.folder), text: 'Vault')]),
                  actions: [IconButton(onPressed: () => Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const PinScreen())), icon: const Icon(Icons.lock))],
                ),
                body: TabBarView(controller: tab, children: [
                  Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                    Icon(isRec? Icons.mic : Icons.mic_none, size: 100, color: isRec? Colors.red : const Color(0xFF00FF88)),
                    const SizedBox(height: 20), Text(isRec? 'Registra nascosto...' : 'Tocca per registrare', style: TextStyle(color: isRec? Colors.red : Colors.white)),
                    const SizedBox(height: 40),
                    GestureDetector(onTap: toggleRec, child: Container(width: 90, height: 90, decoration: BoxDecoration(color: isRec? Colors.red : const Color(0xFF00FF88), shape: BoxShape.circle, boxShadow: [BoxShadow(color: (isRec? Colors.red : const Color(0xFF00FF88)).withOpacity(0.4), blurRadius: 20)]), child: Icon(isRec? Icons.stop : Icons.mic, size: 40, color: Colors.black))),
                    if (lastRecord!= null) Padding(padding: const EdgeInsets.only(top: 30), child: Text('Ultimo: ${lastRecord!.path.split('/').last}', style: const TextStyle(fontSize: 10, color: Colors.grey))),
                  ])),
                  Padding(padding: const EdgeInsets.all(20), child: Column(children: [
                    const Text('SELEZIONA VOCE PER CHIAMATE / VOCALI', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12, letterSpacing: 1)),
                    const SizedBox(height: 20),
                    Wrap(spacing: 10, runSpacing: 10, children: [
                      voiceBtn('Normale', 1.0, Icons.person),
                      voiceBtn('Profonda', 0.7, Icons.record_voice_over),
                      voiceBtn('Acuta', 1.4, Icons.child_care),
                      voiceBtn('Robot', 0.85, Icons.smart_toy),
                      voiceBtn('Gigante', 0.6, Icons.badge),
                      voiceBtn('Scoiattolo', 1.8, Icons.cruelty_free),
                    ]),
                    const SizedBox(height: 30),
                    Container(padding: const EdgeInsets.all(16), decoration: BoxDecoration(color: Colors.white10, borderRadius: BorderRadius.circular(12)), child: Row(children: [const Icon(Icons.graphic_eq, color: Color(0xFF00FF88)), const SizedBox(width: 12), Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('Voce attiva: $voiceName', style: const TextStyle(fontWeight: FontWeight.bold)), Text('Pitch: ${pitch}x - si applica a playback e condivisione', style: const TextStyle(fontSize: 10, color: Colors.grey))]))])),
                    const SizedBox(height: 20),
                    const Text('Come usarla per chiamate: 1) Registra un vocale nella tab Ghost 2) Seleziona voce qui 3) Premi Play per anteprima 4) Condividi su WhatsApp/Telegram come vocale', style: TextStyle(fontSize: 11, color: Colors.grey)),
                    const Spacer(),
                    if (lastRecord!= null) SizedBox(width: double.infinity, child: ElevatedButton.icon(onPressed: () => playWithVoice(lastRecord!), icon: const Icon(Icons.play_arrow), label: Text('Anteprima con voce $voiceName'), style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF00FF88), foregroundColor: Colors.black))),
                  ])),
                  Column(children: [
                    Padding(padding: const EdgeInsets.all(12), child: Row(children: [
                      Expanded(child: ElevatedButton.icon(onPressed: () async { final r = await FilePicker.platform.pickFiles(); if (r!= null && r.files.single.path!= null) { await File(r.files.single.path!).copy('$vaultPath/${r.files.single.name}'); refresh(); } }, icon: const Icon(Icons.upload_file), label: const Text('Nascondi file'))),
                      const SizedBox(width: 8),
                      IconButton(onPressed: refresh, icon: const Icon(Icons.refresh)),
                    ])),
                    Expanded(child: files.isEmpty? const Center(child: Text('Vault vuoto', style: TextStyle(color: Colors.grey))) : ListView.builder(itemCount: files.length, itemBuilder: (c, i) {
                      final f = files[i] as File; final isAudio = f.path.endsWith('.m4a') || f.path.endsWith('.mp3') || f.path.endsWith('.wav');
                      return ListTile(leading: Icon(isAudio? Icons.audio_file : Icons.insert_drive_file, color: const Color(0xFF00FF88)), title: Text(f.path.split('/').last, style: const TextStyle(fontSize: 13)), subtitle: Text('${(f.lengthSync()/1024).toStringAsFixed(1)} KB • $voiceName', style: const TextStyle(fontSize: 10, color: Colors.grey)), onTap: () => playWithVoice(f), trailing: Row(mainAxisSize: MainAxisSize.min, children: [IconButton(icon: const Icon(Icons.share, size: 18), onPressed: () => shareVoice(f)), IconButton(icon: const Icon(Icons.delete, size: 18), onPressed: () { f.deleteSync(); refresh(); })]));
                    })),
                  ]),
                ]),
              );
            }

            Widget voiceBtn(String name, double p, IconData icon) {
              final active = pitch == p;
              return ChoiceChip(
                label: Row(mainAxisSize: MainAxisSize.min, children: [Icon(icon, size: 16, color: active? Colors.black : Colors.white), const SizedBox(width: 6), Text(name)]),
                selected: active,
                onSelected: (_) => setVoice(p, name),
                selectedColor: const Color(0xFF00FF88),
                backgroundColor: Colors.white10,
                labelStyle: TextStyle(color: active? Colors.black : Colors.white, fontWeight: active? FontWeight.bold : FontWeight.normal),
              );
            }

            @override void dispose() { tab.dispose(); player.dispose(); rec.dispose(); super.dispose(); }
          }
          DART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt.com-Voice-APK
          path: build/app/outputs/flutter-apk/app-release.apk
