name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Ensure Android folder
        run: |
          rm -rf android
          flutter create /tmp/f --project-name securecrypt --org com.securecrypt.app --platforms android
          cp -r /tmp/f/android $PWD

      - name: Fix Android minSdk for record
        run: |
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion 16/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = 16/minSdk = 23/g' android/app/build.gradle.kts || true
          cat android/app/build.gradle.kts | grep minSdk || cat android/app/build.gradle | grep minSdk

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
