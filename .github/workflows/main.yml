name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix Gradle - recreate clean
        run: |
          rm -rf android
          flutter create /tmp/fresh --project-name securecrypt --org com.securecrypt.app --platforms android
          mv /tmp/fresh/android $PWD
      - name: Inject clean working code
        run: |
          cat > pubspec.yaml << 'YAML'
          name: securecrypt
          description: SecureCrypt Vault
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F0F0F),
                ),
                home: const PinScreen(),
              );
            }
          }

          class PinScreen extends StatefulWidget {
            const PinScreen({super.key});
            @override
            State<PinScreen> createState() => _PinScreenState();
          }

          class _PinScreenState extends State<PinScreen> {
            final ctrl = TextEditingController();
            String msg = 'PIN: 123456 = vero, 000000 = finto';

            void check() {
              final p = ctrl.text.trim();
              if (p == '123456') {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const VaultScreen(fake: false)));
              } else if (p == '000000') {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const VaultScreen(fake: true)));
              } else {
                setState(() => msg = 'PIN errato');
                ctrl.clear();
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(32),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.lock_outline, size: 80, color: Color(0xFF00FF88)),
                        const SizedBox(height: 20),
                        const Text('SecureCrypt', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 40),
                        TextField(
                          controller: ctrl,
                          obscureText: true,
                          keyboardType: TextInputType.number,
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 24, letterSpacing: 8),
                          decoration: InputDecoration(
                            hintText: '------',
                            border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                          ),
                          onSubmitted: (_) => check(),
                        ),
                        const SizedBox(height: 12),
                        Text(msg, style: const TextStyle(color: Colors.grey, fontSize: 12)),
                        const SizedBox(height: 20),
                        SizedBox(
                          width: double.infinity,
                          child: ElevatedButton(
                            onPressed: check,
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFF00FF88),
                              foregroundColor: Colors.black,
                              padding: const EdgeInsets.symmetric(vertical: 16),
                            ),
                            child: const Text('SBLOCCA'),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class VaultScreen extends StatelessWidget {
            final bool fake;
            const VaultScreen({super.key, required this.fake});
            @override
            Widget build(BuildContext context) {
              if (fake) {
                return Scaffold(
                  appBar: AppBar(title: const Text('Calculator')),
                  body: const Center(child: Text('Nessun file')),
                );
              }
              return Scaffold(
                appBar: AppBar(
                  title: const Text('SecureCrypt Vault'),
                  actions: [
                    IconButton(
                      onPressed: () => Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const PinScreen())),
                      icon: const Icon(Icons.lock),
                    )
                  ],
                ),
                body: const Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.verified_user, size: 100, color: Color(0xFF00FF88)),
                      SizedBox(height: 20),
                      Text('Vault Sbloccato!', style: TextStyle(fontSize: 24)),
                      SizedBox(height: 10),
                      Text('APK funziona - ora aggiungiamo recorder', style: TextStyle(color: Colors.grey)),
                    ],
                  ),
                ),
              );
            }
          }
          DART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
