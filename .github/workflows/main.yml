name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Ensure Android folder
        run: |
          if [! -d "android" ]; then
            echo "android mancante, lo ricreo..."
            flutter create /tmp/f --project-name securecrypt --org com.securecrypt.app --platforms android
            mv /tmp/f/android $PWD/
          fi
          ls -la android/app/

      - name: Fix Android minSdk for record
        run: |
          # Fix per build.gradle (vecchio template)
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 23/g' android/app/build.gradle
            sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle
          fi
          # Fix per build.gradle.kts (nuovo template Flutter 3.22+)
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts
          fi
          # Permesso microfono
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i '/<application/i \ <uses-permission android:name="android.permission.RECORD_AUDIO" \/>' android/app/src/main/AndroidManifest.xml
          fi
          echo "--- FIX OK ---"
          grep -n "minSdk" android/app/build.gradle* || true

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
