name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Recreate Android
        run: |
          rm -rf android
          flutter create /tmp/f --project-name securecrypt --org com.securecrypt.app --platforms android
          cp -r /tmp/f/android $PWD

      - name: Patch Android config
        run: |
          for FILE in android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$FILE" ]; then
              sed -i "s/1.7.10/1.9.22/g; s/1.8.10/1.9.22/g; s/1.8.22/1.9.22/g; s/1.9.10/1.9.22/g" "$FILE" || true
              sed -i "s/flutter.minSdkVersion/23/g" "$FILE" || true
              sed -i "s/minSdkVersion 16/minSdkVersion 23/g" "$FILE" || true
              sed -i "s/minSdk = 16/minSdk = 23/g" "$FILE" || true
              sed -i "s/compileSdkVersion 33/compileSdkVersion 34/g; s/compileSdk 33/compileSdk 34/g; s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g" "$FILE" || true
              sed -i "s/compileSdk = 33/compileSdk = 34/g; s/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g" "$FILE" || true
            fi
          done
          # Assicura namespace
          grep -q "namespace" android/app/build.gradle* || echo "namespace ok"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
