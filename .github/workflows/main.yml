name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Create
        run: |
          rm -rf android
          flutter create /tmp/f --project-name securecrypt --org com.securecrypt.app --platforms android
          mv /tmp/f/android $PWD
          sed -i 's/label="securecrypt"/label="SecureCrypt.com"/' android/app/src/main/AndroidManifest.xml
      - name: Write pubspec
        run: |
          cat > pubspec.yaml << 'YAML'
          name: securecrypt
          publish_to: 'none'
          version: 1.0.0+10
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          flutter:
            uses-material-design: true
          YAML
      - name: Write main
        run: |
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'dart:async';
          import 'package:flutter/material.dart';
          void main()=>runApp(const MyApp());
          class MyApp extends StatelessWidget{
            const MyApp({super.key});
            @override Widget build(BuildContext c)=>MaterialApp(debugShowCheckedModeBanner:false, theme:ThemeData.dark(), home:const Vault());
          }
          class GhostMsg{String t;int ttl;Timer? tm;GhostMsg(this.t,this.ttl);}
          class Vault extends StatefulWidget{const Vault({super.key});@override State<Vault> createState()=>_V();}
          class _V extends State<Vault> with SingleTickerProviderStateMixin{
            late TabController tab; List<GhostMsg> chats=[]; final ctrl=TextEditingController(); int ttl=30; double pitch=1.0; String vname="Normale";
            @override void initState(){super.initState();tab=TabController(length:3, vsync:this);}
            void send(){if(ctrl.text.trim().isEmpty)return; final m=GhostMsg(ctrl.text.trim(),ttl); setState((){chats.insert(0,m); ctrl.clear();}); m.tm=Timer.periodic(const Duration(seconds:1),(t){m.ttl--; if(m.ttl<=0){t.cancel(); setState(()=>chats.remove(m));}else{setState((){});}});}
            @override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text("SecureCrypt.com"), bottom:TabBar(controller:tab, tabs:const[Tab(icon:Icon(Icons.graphic_eq),text:"Voce"),Tab(icon:Icon(Icons.timer),text:"Chat Ghost"),Tab(icon:Icon(Icons.folder),text:"Vault")])), body:TabBarView(controller:tab, children:[
              Center(child:Column(mainAxisAlignment:MainAxisAlignment.center, children:[const Icon(Icons.graphic_eq,size:80,color:Color(0xFF00FF88)), const SizedBox(height:20), Text("Voce: $vname ${pitch}x", style:const TextStyle(fontSize:18)), const SizedBox(height:20), Wrap(spacing:8, children:[
                for(final e in [{"n":"Normale","p":1.0},{"n":"Profonda","p":0.7},{"n":"Acuta","p":1.4},{"n":"Robot","p":0.85},{"n":"Gigante","p":0.6},{"n":"Scoiattolo","p":1.8}])
                  ChoiceChip(label:Text(e["n"] as String), selected:pitch==e["p"], onSelected:(_)=>setState((){pitch=e["p"] as double; vname=e["n"] as String;}))
              ]), const SizedBox(height:20), const Padding(padding:EdgeInsets.all(20), child:Text("Registra vocale, poi condividi con voce modificata. Per chiamate: metti in vivavoce e riproduci audio con voce cambiata.", textAlign:TextAlign.center, style:TextStyle(color:Colors.grey, fontSize:12)))])),
              Column(children:[Padding(padding:const EdgeInsets.all(8), child:Row(children:[const Text("Autodistruggi:"), const SizedBox(width:10), DropdownButton<int>(value:ttl, items:const[DropdownMenuItem(value:5,child:Text("5s")),DropdownMenuItem(value:30,child:Text("30s")),DropdownMenuItem(value:60,child:Text("1m")),DropdownMenuItem(value:300,child:Text("5m"))], onChanged:(v)=>setState(()=>ttl=v!))])), Expanded(child:chats.isEmpty?const Center(child:Text("Chat Ghost\nI messaggi si autodistruggono", textAlign:TextAlign.center, style:TextStyle(color:Colors.grey))):ListView.builder(reverse:true, itemCount:chats.length, itemBuilder:(c,i){final m=chats[i]; return Container(margin:const EdgeInsets.all(8), padding:const EdgeInsets.all(12), decoration:BoxDecoration(color:const Color(0xFF00FF88).withOpacity(0.15), borderRadius:BorderRadius.circular(12), border:Border.all(color:const Color(0xFF00FF88))), child:Column(crossAxisAlignment:CrossAxisAlignment.start, children:[Text(m.t), const SizedBox(height:6), Text("Si autodistrugge in ${m.ttl}s", style:const TextStyle(fontSize:10, color:Color(0xFF00FF88))) ]));})), Padding(padding:const EdgeInsets.all(8), child:Row(children:[Expanded(child:TextField(controller:ctrl, decoration:InputDecoration(hintText:"Messaggio segreto...", filled:true, fillColor:Colors.white10, border:OutlineInputBorder(borderRadius:BorderRadius.circular(20), borderSide:BorderSide.none)))), const SizedBox(width:8), CircleAvatar(backgroundColor:const Color(0xFF00FF88), child:IconButton(icon:const Icon(Icons.send, color:Colors.black), onPressed:send))]))]),
              const Center(child:Text("Vault: file nascosti\n(in prossima build con registratore reale)", textAlign:TextAlign.center))
            ]));
            @override void dispose(){tab.dispose(); for(var m in chats)m.tm?.cancel(); super.dispose();}
          }
          DART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-GREEN
          path: build/app/outputs/flutter-apk/app-release.apk
