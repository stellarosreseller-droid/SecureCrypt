name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix Gradle - recreate clean
        run: |
          rm -rf android
          flutter create /tmp/fresh --project-name securecrypt --org com.securecrypt.app --platforms android
          cp -r /tmp/fresh/android.
          ls -la
      - name: Inject code
        run: |
          cat > pubspec.yaml << 'YAML'
          name: securecrypt
          description: SecureCrypt Vault
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            record: ^5.0.4
            just_audio: ^0.9.36
            path_provider: ^2.1.1
            permission_handler: ^11.3.0
            file_picker: ^8.0.0+1
          flutter:
            uses-material-design: true
          YAML
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:record/record.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:file_picker/file_picker.dart';
          void main()=>runApp(const App());
          class App extends StatelessWidget{const App({super.key}); @override Widget build(BuildContext c)=>MaterialApp(debugShowCheckedModeBanner:false, theme: ThemeData.dark().copyWith(scaffoldBackgroundColor:const Color(0xFF0F0F0F), colorScheme:const ColorScheme.dark(primary:Color(0xFF00FF88))), home:const Pin());}
          class Pin extends StatefulWidget{const Pin({super.key}); @override State<Pin> createState()=>_PinState();}
          class _PinState extends State<Pin>{final t=TextEditingController(); String m="Inserisci PIN"; void ok(){var p=t.text.trim(); if(p=="123456") Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const Vault(fake:false))); else if(p=="000000") Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const Vault(fake:true))); else setState(()=>m="PIN errato"); t.clear();} @override Widget build(BuildContext c)=>Scaffold(body:Center(child:Padding(padding:const EdgeInsets.all(32), child:Column(mainAxisAlignment:MainAxisAlignment.center, children:[const Icon(Icons.lock_outline,size:80,color:Color(0xFF00FF88)),const SizedBox(height:20),const Text("SecureCrypt",style:TextStyle(fontSize:32,fontWeight:FontWeight.bold)),const SizedBox(height:40),TextField(controller:t,obscureText:true,keyboardType:TextInputType.number,textAlign:TextAlign.center,style:const TextStyle(fontSize:24,letterSpacing:10),decoration:InputDecoration(hintText:"------",border:OutlineInputBorder(borderRadius:BorderRadius.circular(12))),onSubmitted:(_)=>ok()),const SizedBox(height:12),Text(m,style:const TextStyle(color:Colors.grey)),const SizedBox(height:20),SizedBox(width:double.infinity,child:ElevatedButton(onPressed:ok,style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFF00FF88),foregroundColor:Colors.black,padding:const EdgeInsets.symmetric(vertical:16)),child:const Text("SBLOCCA",style:TextStyle(fontWeight:FontWeight.bold))))]))));}
          class Vault extends StatefulWidget{final bool fake; const Vault({super.key,required this.fake}); @override State<Vault> createState()=>_VaultState();}
          class _VaultState extends State<Vault> with SingleTickerProviderStateMixin{late TabController tab; final rec=AudioRecorder(); final player=AudioPlayer(); bool isRec=false; List<FileSystemEntity> files=[]; String path=""; @override void initState(){super.initState();tab=TabController(length:2,vsync:this); initV();} Future<void> initV() async{await Permission.microphone.request(); await Permission.storage.request(); final d=await getApplicationDocumentsDirectory(); final vd=Directory("${d.path}/vault"); if(!await vd.exists()) await vd.create(recursive:true); setState(()=>path=vd.path); ref();} void ref(){if(path.isEmpty) return; setState(()=>files=Directory(path).listSync().where((f)=>f is File).toList());} Future<void> tog() async{if(isRec){await rec.stopRecorder(); setState(()=>isRec=false); ref();} else {if(await rec.hasPermission()){final d=await getApplicationDocumentsDirectory(); await rec.start(const RecordConfig(),path:"${d.path}/vault/voice_${DateTime.now().millisecondsSinceEpoch}.m4a"); setState(()=>isRec=true);}}} Future<void> play(File f) async{await player.setFilePath(f.path); await player.play();} Future<void> pick() async{final r=await FilePicker.platform.pickFiles(); if(r!=null&&r.files.single.path!=null){await File(r.files.single.path!).copy("$path/${r.files.single.name}"); ref();}} @override Widget build(BuildContext c){if(widget.fake) return Scaffold(appBar:AppBar(title:const Text("Calculator")),body:const Center(child:Text("Vuoto"))); return Scaffold(appBar:AppBar(title:const Text("SecureCrypt Vault"),bottom:TabBar(controller:tab,tabs:const[Tab(icon:Icon(Icons.mic),text:"Ghost"),Tab(icon:Icon(Icons.folder),text:"File")]),actions:[IconButton(onPressed:()=>Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const Pin())),icon:const Icon(Icons.lock))]),body:TabBarView(controller:tab,children:[Center(child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[Icon(isRec?Icons.mic:Icons.mic_none,size:100,color:isRec?Colors.red:const Color(0xFF00FF88)),const SizedBox(height:40),GestureDetector(onTap:tog,child:Container(width:90,height:90,decoration:BoxDecoration(color:isRec?Colors.red:const Color(0xFF00FF88),shape:BoxShape.circle),child:Icon(isRec?Icons.stop:Icons.mic,size:40,color:Colors.black)))] )),Column(children:[Padding(padding:const EdgeInsets.all(12),child:SizedBox(width:double.infinity,child:ElevatedButton.icon(onPressed:pick,icon:const Icon(Icons.upload_file),label:const Text("Nascondi file")))),Expanded(child:ListView.builder(itemCount:files.length,itemBuilder:(c,i){final f=files[i] as File; return ListTile(title:Text(f.path.split('/').last),onTap:()=>play(f),trailing:IconButton(icon:const Icon(Icons.delete),onPressed:(){f.deleteSync(); ref();}));}))])]));} @override void dispose(){tab.dispose(); player.dispose(); rec.dispose(); super.dispose();}}
          DART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
