name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Create Project
        run: |
          rm -rf android
          flutter create /tmp/fresh --project-name securecrypt --org com.securecrypt.app --platforms android
          mv /tmp/fresh/android $PWD
          sed -i 's/android:label="securecrypt"/android:label="SecureCrypt.com"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/a \ <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml || true
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml || sed -i 's|</manifest>| <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
      - name: Write Pubspec
        run: |
          cat > pubspec.yaml << 'YAML'
          name: securecrypt
          description: SecureCrypt
          publish_to: 'none'
          version: 1.0.0+7
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            record: 5.0.4
            just_audio: 0.9.36
            path_provider: 2.1.1
            permission_handler: 11.3.1
            file_picker: 8.0.6
            share_plus: 8.0.2
          flutter:
            uses-material-design: true
          YAML
      - name: Write Main.dart
        run: |
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:record/record.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:share_plus/share_plus.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(scaffoldBackgroundColor: const Color(0xFF0F0F0F)),
                home: const PinScreen(),
              );
            }
          }

          class PinScreen extends StatefulWidget {
            const PinScreen({super.key});
            @override State<PinScreen> createState() => _PinScreenState();
          }

          class _PinScreenState extends State<PinScreen> {
            final ctrl = TextEditingController();
            void check() {
              final p = ctrl.text.trim();
              if (p == '123456') {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const VaultScreen(fake: false)));
              } else if (p == '000000') {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const VaultScreen(fake: true)));
              }
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(32),
                    child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                      const Icon(Icons.lock_outline, size: 80, color: Color(0xFF00FF88)),
                      const SizedBox(height: 20),
                      const Text('SecureCrypt.com', style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 40),
                      TextField(
                        controller: ctrl,
                        obscureText: true,
                        keyboardType: TextInputType.number,
                        textAlign: TextAlign.center,
                        style: const TextStyle(fontSize: 24, letterSpacing: 8),
                        decoration: InputDecoration(hintText: '------', border: OutlineInputBorder(borderRadius: BorderRadius.circular(12))),
                        onSubmitted: (_) => check(),
                      ),
                      const SizedBox(height: 20),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton(
                          onPressed: check,
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF00FF88), foregroundColor: Colors.black, padding: const EdgeInsets.symmetric(vertical: 16)),
                          child: const Text('SBLOCCA'),
                        ),
                      )
                    ]),
                  ),
                ),
              );
            }
          }

          class GhostMsg {
            String text;
            int ttl;
            Timer? timer;
            bool viewed = false;
            GhostMsg(this.text, this.ttl);
          }

          class VaultScreen extends StatefulWidget {
            final bool fake;
            const VaultScreen({super.key, required this.fake});
            @override State<VaultScreen> createState() => _VaultScreenState();
          }

          class _VaultScreenState extends State<VaultScreen> with SingleTickerProviderStateMixin {
            late TabController tab;
            final rec = AudioRecorder();
            final player = AudioPlayer();
            bool isRec = false;
            List<FileSystemEntity> files = [];
            String vaultPath = '';
            double pitch = 1.0;
            String voiceName = 'Normale';
            File? lastRecord;
            List<GhostMsg> chats = [];
            final chatCtrl = TextEditingController();
            int selectedTTL = 30;

            @override void initState() {
              super.initState();
              tab = TabController(length: 4, vsync: this);
              initVault();
            }

            Future<void> initVault() async {
              await Permission.microphone.request();
              await Permission.storage.request();
              final d = await getApplicationDocumentsDirectory();
              final vd = Directory('${d.path}/vault');
              if (!await vd.exists()) await vd.create(recursive: true);
              setState(() { vaultPath = vd.path; });
              refresh();
            }

            void refresh() {
              if (vaultPath.isEmpty) return;
              setState(() { files = Directory(vaultPath).listSync().where((f) => f is File).toList(); });
            }

            Future<void> toggleRec() async {
              if (isRec) {
                final p = await rec.stop();
                setState(() { isRec = false; });
                if (p!= null) lastRecord = File(p);
                refresh();
              } else {
                if (await rec.hasPermission()) {
                  final dir = await getApplicationDocumentsDirectory();
                  final path = '${dir.path}/vault/rec_${DateTime.now().millisecondsSinceEpoch}.m4a';
                  await rec.start(const RecordConfig(), path: path);
                  setState(() { isRec = true; });
                }
              }
            }

            Future<void> playWithVoice(File f) async {
              await player.stop();
              await player.setFilePath(f.path);
              await player.setSpeed(pitch);
              await player.play();
            }

            void setVoice(double p, String name) {
              setState(() { pitch = p; voiceName = name; });
              if (player.playing) player.setSpeed(p);
            }

            void sendGhost() {
              if (chatCtrl.text.trim().isEmpty) return;
              final msg = GhostMsg(chatCtrl.text.trim(), selectedTTL);
              setState(() { chats.insert(0, msg); chatCtrl.clear(); });
              msg.timer = Timer.periodic(const Duration(seconds: 1), (t) {
                msg.ttl--;
                if (msg.ttl <= 0 || msg.viewed) {
                  t.cancel();
                  setState(() { chats.remove(msg); });
                } else {
                  setState(() {});
                }
              });
            }

            @override Widget build(BuildContext context) {
              if (widget.fake) {
                return Scaffold(appBar: AppBar(title: const Text('Calculator')), body: const Center(child: Text('Vuoto')));
              }
              return Scaffold(
                appBar: AppBar(
                  title: const Text('SecureCrypt.com'),
                  bottom: TabBar(controller: tab, isScrollable: true, tabs: const [
                    Tab(icon: Icon(Icons.mic), text: 'Ghost'),
                    Tab(icon: Icon(Icons.graphic_eq), text: 'Voce'),
                    Tab(icon: Icon(Icons.timer_off), text: 'Chat'),
                    Tab(icon: Icon(Icons.folder), text: 'Vault'),
                  ]),
                ),
                body: TabBarView(controller: tab, children: [
                  Center(
                    child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                      Icon(isRec? Icons.mic : Icons.mic_none, size: 100, color: isRec? Colors.red : const Color(0xFF00FF88)),
                      const SizedBox(height: 20),
                      GestureDetector(
                        onTap: toggleRec,
                        child: Container(width: 90, height: 90, decoration: BoxDecoration(color: isRec? Colors.red : const Color(0xFF00FF88), shape: BoxShape.circle), child: Icon(isRec? Icons.stop : Icons.mic, size: 40, color: Colors.black)),
                      ),
                      const SizedBox(height: 10),
                      Text(isRec? 'REGISTRO...' : 'Tocca per registrare'),
                    ]),
                  ),
                  Padding(
                    padding: const EdgeInsets.all(20),
                    child: Column(children: [
                      Wrap(spacing: 10, runSpacing: 10, children: [
                        ChoiceChip(label: const Text('Normale'), selected: pitch == 1.0, onSelected: (_) => setVoice(1.0, 'Normale'), selectedColor: const Color(0xFF00FF88)),
                        ChoiceChip(label: const Text('Profonda'), selected: pitch == 0.7, onSelected: (_) => setVoice(0.7, 'Profonda'), selectedColor: const Color(0xFF00FF88)),
                        ChoiceChip(label: const Text('Acuta'), selected: pitch == 1.4, onSelected: (_) => setVoice(1.4, 'Acuta'), selectedColor: const Color(0xFF00FF88)),
                        ChoiceChip(label: const Text('Robot'), selected: pitch == 0.85, onSelected: (_) => setVoice(0.85, 'Robot'), selectedColor: const Color(0xFF00FF88)),
                        ChoiceChip(label: const Text('Gigante'), selected: pitch == 0.6, onSelected: (_) => setVoice(0.6, 'Gigante'), selectedColor: const Color(0xFF00FF88)),
                        ChoiceChip(label: const Text('Scoiattolo'), selected: pitch == 1.8, onSelected: (_) => setVoice(1.8, 'Scoiattolo'), selectedColor: const Color(0xFF00FF88)),
                      ]),
                      const SizedBox(height: 20),
                      Container(padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.white10, borderRadius: BorderRadius.circular(10)), child: Row(children: [const Icon(Icons.graphic_eq, color: Color(0xFF00FF88)), const SizedBox(width: 10), Text('Attiva: $voiceName ${pitch}x')])),
                      const Spacer(),
                      if (lastRecord!= null) SizedBox(width: double.infinity, child: ElevatedButton.icon(onPressed: () => playWithVoice(lastRecord!), icon: const Icon(Icons.play_arrow), label: Text('Prova $voiceName'), style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF00FF88), foregroundColor: Colors.black))),
                    ]),
                  ),
                  Column(children: [
                    Container(color: Colors.white10, padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8), child: Row(children: [const Text('Autodistruggi:'), const SizedBox(width: 10), DropdownButton<int>(value: selectedTTL, dropdownColor: const Color(0xFF1E1E1E), items: const [DropdownMenuItem(value: 5, child: Text('5 sec')), DropdownMenuItem(value: 30, child: Text('30 sec')), DropdownMenuItem(value: 60, child: Text('1 min')), DropdownMenuItem(value: 300, child: Text('5 min'))], onChanged: (v) => setState(() => selectedTTL = v!))])),
                    Expanded(child: chats.isEmpty? const Center(child: Text('Nessun messaggio\nSi autodistruggono', textAlign: TextAlign.center, style: TextStyle(color: Colors.grey))) : ListView.builder(reverse: true, itemCount: chats.length, itemBuilder: (c, i) { final m = chats[i]; return Container(margin: const EdgeInsets.all(8), padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: const Color(0xFF00FF88).withOpacity(0.15), borderRadius: BorderRadius.circular(12), border: Border.all(color: const Color(0xFF00FF88))), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(m.text), const SizedBox(height: 6), Text('Distrugge in ${m.ttl}s', style: const TextStyle(fontSize: 10, color: Color(0xFF00FF88)))])); })),
                    Padding(padding: const EdgeInsets.all(8), child: Row(children: [Expanded(child: TextField(controller: chatCtrl, decoration: InputDecoration(hintText: 'Messaggio segreto...', filled: true, fillColor: Colors.white10, border: OutlineInputBorder(borderRadius: BorderRadius.circular(20), borderSide: BorderSide.none)), onSubmitted: (_) => sendGhost())), const SizedBox(width: 8), CircleAvatar(backgroundColor: const Color(0xFF00FF88), child: IconButton(icon: const Icon(Icons.send, color: Colors.black), onPressed: sendGhost))]),
                  ]),
                  Column(children: [
                    Padding(padding: const EdgeInsets.all(12), child: SizedBox(width: double.infinity, child: ElevatedButton.icon(onPressed: () async { final r = await FilePicker.platform.pickFiles(); if (r!= null && r.files.single.path!= null) { await File(r.files.single.path!).copy('$vaultPath/${r.files.single.name}'); refresh(); } }, icon: const Icon(Icons.upload_file), label: const Text('Nascondi file')))),
                    Expanded(child: ListView.builder(itemCount: files.length, itemBuilder: (c, i) { final f = files[i] as File; return ListTile(title: Text(f.path.split('/').last, style: const TextStyle(fontSize: 13)), trailing: Row(mainAxisSize: MainAxisSize.min, children: [IconButton(icon: const Icon(Icons.share, size: 18), onPressed: () async { await Share.shareXFiles([XFile(f.path)]); }), IconButton(icon: const Icon(Icons.delete, size: 18), onPressed: () { f.deleteSync(); refresh(); })])); })),
                  ]),
                ]),
              );
            }

            @override void dispose() {
              tab.dispose();
              player.dispose();
              rec.dispose();
              for (var m in chats) m.timer?.cancel();
              super.dispose();
            }
          }
          DART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-Full-APK
          path: build/app/outputs/flutter-apk/app-release.apk
