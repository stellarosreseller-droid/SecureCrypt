name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true
      - name: Create Android folder if missing
        run: |
          if [! -f "android/app/build.gradle" ]; then
            flutter create. --project-name securecrypt --org com.securecrypt.app --platforms android
          fi
      - name: Inject SecureCrypt code
        run: |
          mkdir -p lib
          cat > lib/main.dart << 'DART'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:record/record.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:file_picker/file_picker.dart';

          void main() => runApp(const SecureCryptApp());
          class SecureCryptApp extends StatelessWidget {
            const SecureCryptApp({super.key});
            @override Widget build(BuildContext context) => MaterialApp(debugShowCheckedModeBanner: false, theme: ThemeData.dark().copyWith(scaffoldBackgroundColor: Color(0xFF0F0F0F), colorScheme: ColorScheme.dark(primary: Color(0xFF00FF88))), home: const PinScreen());
          }
          class PinScreen extends StatefulWidget { const PinScreen({super.key}); @override State<PinScreen> createState() => _PinScreenState(); }
          class _PinScreenState extends State<PinScreen> {
            final c = TextEditingController(); String m="Inserisci PIN";
            void check(){ var p=c.text.trim(); if(p=="123456") Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const VaultScreen(isFake:false))); else if(p=="000000") Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const VaultScreen(isFake:true))); else setState(()=>m="PIN errato"); c.clear(); }
            @override Widget build(BuildContext context) => Scaffold(body: Center(child: Padding(padding: EdgeInsets.all(32), child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[Icon(Icons.lock_outline,size:80,color:Color(0xFF00FF88)), SizedBox(height:20), Text("SecureCrypt",style:TextStyle(fontSize:32,fontWeight:FontWeight.bold)), SizedBox(height:40), TextField(controller:c,obscureText:true,keyboardType:TextInputType.number,textAlign:TextAlign.center,style:TextStyle(fontSize:24,letterSpacing:10),decoration:InputDecoration(hintText:"------",border:OutlineInputBorder(borderRadius:BorderRadius.circular(12))),onSubmitted:(_)=>check()), SizedBox(height:12), Text(m,style:TextStyle(color:Colors.grey)), SizedBox(height:20), SizedBox(width:double.infinity, child: ElevatedButton(onPressed:check, style: ElevatedButton.styleFrom(backgroundColor: Color(0xFF00FF88), foregroundColor: Colors.black, padding: EdgeInsets.symmetric(vertical:16)), child: Text("SBLOCCA",style:TextStyle(fontWeight:FontWeight.bold))))]))));
          }
          class VaultScreen extends StatefulWidget { final bool isFake; const VaultScreen({super.key, required this.isFake}); @override State<VaultScreen> createState() => _VaultScreenState(); }
          class _VaultScreenState extends State<VaultScreen> with SingleTickerProviderStateMixin {
            late TabController tab; final rec=AudioRecorder(); final player=AudioPlayer(); bool isRec=false; List<FileSystemEntity> files=[]; String vaultPath="";
            @override void initState(){ super.initState(); tab=TabController(length:2,vsync:this); initV(); }
            Future<void> initV() async { await Permission.microphone.request(); await Permission.storage.request(); final d=await getApplicationDocumentsDirectory(); final vd=Directory("${d.path}/vault"); if(!await vd.exists()) await vd.create(recursive:true); setState(()=>vaultPath=vd.path); ref(); }
            void ref(){ if(vaultPath.isEmpty) return; setState(()=>files=Directory(vaultPath).listSync().where((f)=>f is File).toList()); }
            Future<void> tog() async { if(isRec){ await rec.stopRecorder(); setState(()=>isRec=false); ref(); } else { if(await rec.hasPermission()){ final d=await getApplicationDocumentsDirectory(); await rec.start(RecordConfig(), path:"${d.path}/vault/voice_${DateTime.now().millisecondsSinceEpoch}.m4a"); setState(()=>isRec=true); } } }
            Future<void> play(File f) async { await player.setFilePath(f.path); await player.play(); }
            Future<void> pick() async { final r=await FilePicker.platform.pickFiles(); if(r!=null){ await File(r.files.single.path!).copy("$vaultPath/${r.files.single.name}"); ref(); } }
            @override Widget build(BuildContext context){ if(widget.isFake) return Scaffold(appBar: AppBar(title:Text("Calculator")), body: Center(child:Text("Nessun file"))); return Scaffold(appBar: AppBar(title:Text("SecureCrypt Vault"), bottom: TabBar(controller:tab, tabs:[Tab(icon:Icon(Icons.mic),text:"Ghost Voice"), Tab(icon:Icon(Icons.folder),text:"File")]), actions:[IconButton(onPressed:()=>Navigator.pushReplacement(context, MaterialPageRoute(builder:(_)=>const PinScreen())), icon:Icon(Icons.lock))]), body: TabBarView(controller:tab, children:[Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children:[Icon(isRec?Icons.mic:Icons.mic_none,size:100,color:isRec?Colors.red:Color(0xFF00FF88)), SizedBox(height:40), GestureDetector(onTap:tog, child: Container(width:90,height:90,decoration:BoxDecoration(color:isRec?Colors.red:Color(0xFF00FF88),shape:BoxShape.circle), child: Icon(isRec?Icons.stop:Icons.mic,size:40,color:Colors.black)))] )), Column(children:[Padding(padding:EdgeInsets.all(12), child: SizedBox(width:double.infinity, child: ElevatedButton.icon(onPressed:pick,icon:Icon(Icons.upload_file),label:Text("Nascondi file")))), Expanded(child: ListView.builder(itemCount:files.length, itemBuilder:(c,i){ final f=files[i] as File; return ListTile(title:Text(f.path.split('/').last), onTap:()=>play(f), trailing: IconButton(icon:Icon(Icons.delete), onPressed:(){ f.deleteSync(); ref(); })); }))])])); }
            @override void dispose(){ tab.dispose(); player.dispose(); rec.dispose(); super.dispose(); }
          }
          DART
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
