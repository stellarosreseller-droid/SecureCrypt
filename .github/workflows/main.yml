name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - run: |
          if [! -d "android" ]; then
            flutter create. --project-name securecrypt --org com.securecrypt.app
          fi
          rm -f lib/main.dart
          mkdir -p lib
          cp -r.github/workflows/main.dart lib/main.dart || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
