name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Recreate Android
        run: |
          rm -rf android
          flutter create /tmp/f --project-name securecrypt --org com.securecrypt.app --platforms android
          cp -r /tmp/f/android $PWD
          rm -f android/local.properties

      - name: Patch app
        run: |
          sed -i "s/flutter.minSdkVersion/23/g; s/minSdkVersion 16/minSdkVersion 23/g; s/minSdk = 16/minSdk = 23/g" android/app/build.gradle 2>/dev/null || true
          sed -i "s/flutter.minSdkVersion/23/g; s/minSdk = 16/minSdk = 23/g" android/app/build.gradle.kts 2>/dev/null || true
          echo "org.gradle.configuration-cache=false" >> android/gradle.properties

      - name: Get deps
        run: flutter pub get

      - name: Patch record_android plugin directly
        run: |
          RECORD_PATH=$(find ~/.pub-cache -type d -name "record_android*" | head -1)
          echo "Patching $RECORD_PATH"
          ls $RECORD_PATH/android/
          # forza compileSdk 34 dentro il plugin
          sed -i "s/flutter.compileSdkVersion/34/g" $RECORD_PATH/android/build.gradle || true
          sed -i "s/compileSdkVersion 33/compileSdkVersion 34/g" $RECORD_PATH/android/build.gradle || true
          sed -i "s/compileSdk 33/compileSdk 34/g" $RECORD_PATH/android/build.gradle || true
          sed -i "s/compileSdkVersion 34/compileSdkVersion 34/g" $RECORD_PATH/android/build.gradle || true
          # se manca del tutto, aggiungilo
          if! grep -q "compileSdkVersion" $RECORD_PATH/android/build.gradle; then
            sed -i "/android {/a \ compileSdkVersion 34" $RECORD_PATH/android/build.gradle
          fi
          if! grep -q "compileSdk" $RECORD_PATH/android/build.gradle; then
            sed -i "/android {/a \ compileSdk 34" $RECORD_PATH/android/build.gradle
          fi
          cat $RECORD_PATH/android/build.gradle | grep -A2 -B2 compileSdk

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
