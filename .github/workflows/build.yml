name: build
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get deps
        run: flutter pub get
      - name: Recreate android
        run: |
          rm -rf android
          flutter create . --platforms=android
      - name: Install Pillow
        run: pip install Pillow --user
      - name: Generate valid icons
        run: |
          cat > /tmp/make_icons.py << 'PY'
          from PIL import Image
          from pathlib import Path
          src_path = Path("assets/icon.png")
          try:
              src = Image.open(src_path).convert("RGBA")
              print(f"Usata icona esistente: {src_path}")
          except Exception as e:
              print(f"assets/icon.png non valida ({e}), creo icona lucchetto di default")
              # crea icona lucchetto grigia di default 1024x1024
              src = Image.new("RGBA", (1024, 1024), (0,0,0,0))
              # disegna un cerchio grigio semplice come placeholder
              from PIL import ImageDraw
              draw = ImageDraw.Draw(src)
              draw.rounded_rectangle([150,400,874,900], radius=80, fill=(120,120,120,255))
              draw.rounded_rectangle([350,200,674,500], radius=120, outline=(180,180,180,255), width=60)
          
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder,size in sizes.items():
              p = Path(f"android/app/src/main/res/{folder}")
              p.mkdir(parents=True, exist_ok=True)
              img = src.resize((size,size), Image.LANCZOS)
              img.save(p/"ic_launcher.png", "PNG")
              img.save(p/"ic_launcher_round.png", "PNG")
          print("Icone OK")
          PY
          python3 /tmp/make_icons.py
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
