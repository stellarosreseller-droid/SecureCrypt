name: build
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get deps
        run: flutter pub get
      - name: Recreate android
        run: |
          rm -rf android
          flutter create . --platforms=android
      - name: Install Pillow
        run: pip install Pillow
      - name: Generate valid icons
        run: |
          python3 -c "
          from PIL import Image
          from pathlib import Path
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          src = Image.open('assets/icon.png').convert('RGBA')
          for folder,size in sizes.items():
              p = Path(f'android/app/src/main/res/{folder}')
              p.mkdir(parents=True, exist_ok=True)
              img = src.resize((size,size), Image.LANCZOS)
              img.save(p/'ic_launcher.png', 'PNG')
              img.save(p/'ic_launcher_round.png', 'PNG')
          print('icons generated')
          "
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
