name: build
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Debug assets
        run: |
          ls -lh assets/ || echo "no assets folder"
          file assets/icon.png || echo "icon.png not found"
      - name: Get deps
        run: flutter pub get
      - name: Recreate android
        run: |
          rm -rf android
          flutter create . --platforms=android
      - name: Install Pillow
        run: pip install Pillow --user
      - name: Generate valid icons
        run: |
          python3 -c "
          from PIL import Image
          from pathlib import Path
          import sys
          src_path = Path('assets/icon.png')
          if not src_path.exists():
              print('ERRORE: assets/icon.png non esiste!'); sys.exit(1)
          try:
              src = Image.open(src_path)
              src = src.convert('RGBA')
          except Exception as e:
              print(f'ERRORE: icon.png non è un immagine valida: {e}'); sys.exit(1)
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              p = Path(f'android/app/src/main/res/{folder}')
              p.mkdir(parents=True, exist_ok=True)
              img = src.resize((size,size), Image.LANCZOS)
              img.save(p/'ic_launcher.png', 'PNG')
              img.save(p/'ic_launcher_round.png', 'PNG')
          print('Icone generate OK')
          "
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
