name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get deps
        run: flutter pub get
      - name: Fix Android v1 embedding
        run: |
          if [! -d "android" ]; then
            echo "Android folder missing, recreating..."
            flutter create. --platforms=android --org com.example
          fi
          sed -i 's/android:value="1"/android:value="2"/g' android/app/src/main/AndroidManifest.xml || true
          rm -rf android/app/src/main/java/io/flutter/app || true
      - name: Set custom icon
        run: |
          if [ -f assets/icon.png ]; then
            for d in android/app/src/main/res/mipmap-*; do
              mkdir -p "$d"
              cp assets/icon.png "$d/ic_launcher.png"
              cp assets/icon.png "$d/ic_launcher_round.png"
            done
            echo "Custom icon applied"
          fi
      - name: Patch record_android
        run: |
          FILE=$(find ~/.pub-cache -path "*record_android-*/android/build.gradle" | head -n 1)
          if [ -f "$FILE" ]; then
            sed -i 's/namespace.*//' "$FILE" || true
            sed -i 's/compileSdk.*/compileSdk 34/' "$FILE" || true
          fi
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
