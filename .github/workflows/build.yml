name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get deps
        run: flutter pub get
      - name: Recreate android folder to fix v1 embedding
        run: |
          rm -rf android
          flutter create. --platforms=android --org com.example
      - name: Set custom icon
        run: |
          if [ -f assets/icon.png ]; then
            for d in android/app/src/main/res/mipmap-*; do
              cp assets/icon.png "$d/ic_launcher.png"
              cp assets/icon.png "$d/ic_launcher_round.png"
            done
          fi
      - name: Patch record_android
        run: |
          FILE=$(find ~/.pub-cache -path "*record_android-*/android/build.gradle" | head -n 1)
          if [ -f "$FILE" ]; then
            sed -i 's/namespace.*//' "$FILE" || true
            sed -i 's/compileSdk.*/compileSdk 34/' "$FILE" || true
          fi
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCrypt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
